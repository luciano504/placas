name: Atualizar dados das placas

on:
  schedule:
    - cron: '0 8,11,14,17,20,23 * * *'   # 05h, 08h, 11h, 14h, 17h e 20h em Recife
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - run: python scripts/gerar_placas_data.py
      - name: Commit e push dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Atualiza dados das placas"
          git push
